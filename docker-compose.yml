# video_a is a secondary/optional component meant to run alongside an already-running ta_vms
# (or Square) stack — the shared network is expected to already exist by the time this compose
# file starts, hence `external: true` (unlike ta_vms's own compose, which creates it if absent).
networks:
  default:
    name: common_app_network
    external: true

services:
  analytics-worker:
    build: .
    env_file:
      - .env
    # The port a media server publishes a stream to. Not published to the host: the producer is on
    # the shared network and reaches the worker by service name.
    expose:
      - "${ANALYTICS_RTSP_PORT:-8555}"
    volumes:
      - ./models:/models:ro

  analytics-worker-dapr:
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "analytics-worker"
      - "-app-port"
      - "${ANALYTICS_GRPC_PORT:-50060}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components:/components"
    network_mode: "service:analytics-worker"
    depends_on:
      - analytics-worker
