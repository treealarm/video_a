// The analytics contract. It lives in two places, byte for byte the same, and this header is
// worded so that it stays true in both: the canonical file is video_a/proto/analytics.proto,
// and ta_vms carries a vendored copy at web_vms/VmsAnalyticsSingleton/proto/analytics.proto.
// Both sides generate code from their own copy, so a change goes into both in one step -- an
// empty `diff` between them is the whole of the check.
//
// video_a is a generic, product-agnostic RTSP-analytics engine: it knows nothing about camera
// models, VmsCfg, or Dapr pub/sub. It exposes a small imperative control surface (StartWatch /
// StopWatch) plus a single detection stream; the caller (VmsAnalytics in ta_vms) is the only
// side that maps watch_id back to its own domain concepts.
syntax = "proto3";

import "google/protobuf/timestamp.proto";

package analytics;

service AnalyticsService {
  rpc StartWatch(WatchRequest) returns (WatchResponse);
  rpc StopWatch(StopWatchRequest) returns (OperationStatus);
  rpc StreamDetections(StreamDetectionsRequest) returns (stream DetectionEvent);
  rpc EmbedImage(EmbedImageRequest) returns (EmbedImageResponse);
  // Stateless background-motion estimate between two JPEG snapshots. Used by PTZ calibration.
  rpc EstimateGlobalMotion(EstimateGlobalMotionRequest) returns (EstimateGlobalMotionResponse);
}

enum DetectionKind {
  DETECTION_KIND_UNSPECIFIED = 0;
  PERSON = 1;
  FACE = 2;
  VEHICLE = 3;
  LICENSE_PLATE = 4;
}

message BoundingBox {
  float x = 1;
  float y = 2;
  float width = 3;
  float height = 4;
}

message WatchRequest {
  string watch_id = 1;
  string rtsp_url = 2;
  optional string cred_user = 3;
  optional string cred_pass = 4;
  repeated DetectionKind classes = 5;
  float min_confidence = 6;
  uint32 sample_fps = 7;
  // FACE / LICENSE_PLATE events always carry crop_jpeg (they are the caller's persistent
  // artifacts). This debug flag additionally attaches crops to PERSON / VEHICLE events —
  // off by default, costs one JPEG encode per detection.
  bool attach_debug_crops = 8;
  // Wait to be published to instead of connecting out. The worker opens an RTSP endpoint of its
  // own and answers with its address; whoever produces the stream publishes there.
  //
  // This exists because a detector and an operator reading the same high-bitrate path through a
  // media router is what makes the operator's live view stutter -- the router pushes the same
  // keyframe burst to both in turn, and the browser misses its frame-assembly window. Being
  // published to directly takes the detector off that path entirely.
  bool listen_for_push = 9;
  // Read this file instead of a stream. An absolute path on the worker's own filesystem; the
  // watch then behaves exactly as it does on RTSP, paced to the file's own timestamps, and
  // restarts at the end so a short clip stands in for a continuous source.
  //
  // Set instead of rtsp_url, not alongside it: a watch has one source.
  //
  // This and listen_for_push above both take the media router off the detector's path, and they
  // are not alternatives to each other. A live camera has no file to read -- its video exists
  // only inside the process holding the socket -- so it uses the push. An offline pass over a
  // corpus has no live source, and packing a clip into a stream just to hand it to the detector
  // would add a link with nothing to test in it -- so it names the file.
  optional string file_path = 10;
}

message WatchResponse {
  bool success = 1;
  string message = 2;
  // Where to publish, when listen_for_push was asked for. Built from the worker's advertised
  // host and port: only the worker knows the address it is reachable at.
  string listen_rtsp_url = 3;
}

message StopWatchRequest {
  string watch_id = 1;
}

message OperationStatus {
  bool success = 1;
  string message = 2;
}

message StreamDetectionsRequest {}

message DetectionEvent {
  string watch_id = 1;
  int64 track_id = 2;
  DetectionKind kind = 3;
  float confidence = 4;
  BoundingBox bbox = 5;
  google.protobuf.Timestamp detected_at = 6;
  optional string recognized_text = 8;
  optional float text_confidence = 9;
  // JPEG of the detected object's bbox region. Always set for FACE / LICENSE_PLATE; set for
  // PERSON / VEHICLE only when WatchRequest.attach_debug_crops. The worker keeps no copy —
  // persisting this is entirely the caller's concern (video_a is stateless).
  bytes crop_jpeg = 10;
  // L2-normalized appearance embedding of the object, for downstream re-identification. The
  // embedding space is implied by `kind` (PERSON -> body/OSNet, FACE -> face/ArcFace). Present on
  // every frame of a live track (so a bounded drop-oldest queue can never leave a track with no
  // vector), but only actually recomputed on track START and once per ANALYTICS_REID_EMBED_INTERVAL_SEC
  // thereafter — the carried-along frames repeat the last computed vector. Empty when no embedder
  // model is loaded. The worker assigns no identity; matching an embedding to an object_id is the
  // caller's concern.
  repeated float embedding = 11;
  // True only on the frame the embedding was freshly recomputed (START / interval); false on the
  // carried-along repeats. Lets the caller record a gallery sighting once per real observation
  // instead of once per frame, without losing the vector to queue drops.
  bool embedding_is_fresh = 12;
  // When this detection was finished and handed over for delivery, as opposed to detected_at,
  // which is when the frame it describes arrived.
  //
  // The two exist to be subtracted. detected_at has to name the frame -- an archive box drawn at
  // any other instant sits on the wrong picture -- so it is stamped before the models run, and the
  // interval between the two stamps is what the detector costs. Without this field that cost is
  // indistinguishable from slow delivery, and both were being blamed for the other.
  google.protobuf.Timestamp emitted_at = 13;
}

message EmbedImageRequest {
  bytes jpeg = 1;
  DetectionKind kind = 2;
  optional BoundingBox bbox = 3;
  bool detect_first = 4;
}

message EmbedImageResponse {
  bool success = 1;
  string message = 2;
  repeated float embedding = 3;
  optional BoundingBox bbox = 4;
}

message EstimateGlobalMotionRequest {
  bytes before_jpeg = 1;
  bytes after_jpeg = 2;
}

message EstimateGlobalMotionResponse {
  bool success = 1;
  string message = 2;
  // Normalized image-space shift: positive dx means the scene moved right in the frame.
  float dx = 3;
  float dy = 4;
  // Estimated roll in radians (positive = clockwise). May be zero when only translation fits.
  float rotation = 5;
  float confidence = 6;
}
